apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniflux
  namespace: miniflux
spec:
  replicas: 2
  selector:
    matchLabels:
      app: miniflux
  template:
    metadata:
      labels:
        app: miniflux
    spec:
      containers:
      - name: miniflux
        image: miniflux/miniflux:latest
        ports:
        - containerPort: 8080
        env:
        - name: LISTEN_ADDR
          value: "0.0.0.0:8080"
        - name: RUN_MIGRATIONS
          value: "1"
        - name: CREATE_ADMIN
          value: "1"
        - name: DATABASE_URL
          valueFrom: { secretKeyRef: { name: miniflux-secrets, key: DATABASE_URL } }
        - name: ADMIN_USERNAME
          valueFrom: { secretKeyRef: { name: miniflux-secrets, key: ADMIN_USERNAME } }
        - name: ADMIN_PASSWORD
          valueFrom: { secretKeyRef: { name: miniflux-secrets, key: ADMIN_PASSWORD } }
        readinessProbe:
          httpGet: { path: /healthcheck, port: 8080 }
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /healthcheck, port: 8080 }
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits:   { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: miniflux
  namespace: miniflux
spec:
  selector:
    app: miniflux
  ports:
  - port: 80
    targetPort: 8080
